# Replace IMAGE below, then: oc apply -f openshift.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ond-dashboard-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ond-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: ond-dashboard}
  template:
    metadata:
      labels: {app: ond-dashboard}
    spec:
      containers:
        - name: web
          image: IMAGE
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ond-dashboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: ond-dashboard
spec:
  selector: {app: ond-dashboard}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ond-dashboard
spec:
  to: {kind: Service, name: ond-dashboard}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
